<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拓展功能弹窗 - OneKey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #FBF4F2;
    }
  </style>
</head>
<body class="bg-[#FBF4F2] text-[#2D2326] min-h-screen flex items-center justify-center p-0 m-0 select-none overflow-hidden relative">

  <!-- 背景：压暗并高斯模糊的 OneKey 首页 -->
  <div class="absolute inset-0 w-full h-full flex flex-col justify-between p-5 pointer-events-none filter blur-[7px] brightness-[0.88] scale-[1.02] transform transition-all duration-300">
    <!-- 模拟首页状态栏与顶栏 -->
    <div class="space-y-4">
      <div class="flex justify-between items-center text-xs text-[#70555B] pt-2 px-1">
        <span class="font-semibold tracking-wider">09:41</span>
        <div class="flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4z"/></svg>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-9 h-9 rounded-full bg-[#F3E5E3] flex items-center justify-center border border-[#9B4A5A]/20">
            <div class="w-5 h-5 rounded-full border-2 border-[#9B4A5A] flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-[#9B4A5A]"></div>
            </div>
          </div>
          <span class="text-xl font-bold tracking-tight text-[#2D2326]">OneKey</span>
        </div>
        <span class="px-2.5 py-1 text-xs rounded-full bg-[#EBD8DB] text-[#9B4A5A] font-medium">服务在线</span>
      </div>

      <!-- 设备状态卡片 -->
      <div class="bg-[#FFF9F8] rounded-2xl p-4 border border-[#F0DFDE] shadow-sm">
        <div class="flex justify-between items-start mb-3">
          <div>
            <div class="text-lg font-bold text-[#2D2326]">OnePlus 16</div>
            <div class="text-xs text-[#70555B] mt-0.5">98260 越狱链 · SU 就绪</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-[#F5EAE8]">
          <div class="bg-[#FBF4F2] p-2 rounded-xl text-xs text-[#70555B]">核心架构: SD 8 Gen 5</div>
          <div class="bg-[#FBF4F2] p-2 rounded-xl text-xs text-[#70555B]">SELinux: 宽容模式</div>
        </div>
      </div>

      <!-- 越狱按钮 -->
      <div class="w-full py-3.5 rounded-2xl bg-[#9B4A5A] text-[#FFF9F8] text-center font-semibold text-base shadow-sm">
        开始越狱
      </div>
    </div>

    <!-- 底部导航占位 -->
    <div class="bg-[#FFF9F8] rounded-full p-3 border border-[#F0DFDE] flex justify-around items-center">
      <div class="w-6 h-6 rounded-full bg-[#9B4A5A]"></div>
      <div class="w-6 h-6 rounded-full bg-[#E5D7D9]"></div>
      <div class="w-6 h-6 rounded-full bg-[#E5D7D9]"></div>
      <div class="w-6 h-6 rounded-full bg-[#E5D7D9]"></div>
    </div>
  </div>

  <!-- 遮罩层压暗 -->
  <div class="absolute inset-0 bg-[#2D2326]/35 transition-opacity"></div>

  <!-- 模态弹窗：宽约屏幕 88%，圆角 24dp (rounded-[24px])，背景 #FFF9F8，内边距 20dp (p-5) -->
  <div class="relative z-10 w-[88%] max-w-[360px] bg-[#FFF9F8] rounded-[24px] p-5 shadow-xl border border-[#F3E5E3] flex flex-col box-border">

    <!-- 弹窗标题栏与副标题 -->
    <div class="mb-2">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-[#2D2326] tracking-tight m-0">拓展功能</h2>
        <!-- 右上角关闭按钮 (纯几何矢量 SVG) -->
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-[#70555B] hover:text-[#2D2326] hover:bg-[#F3E7E5] active:scale-95 transition-all" aria-label="关闭">
          <svg class="w-4 h-4 stroke-[#70555B]" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <p class="text-xs text-[#70555B] mt-0.5 leading-normal">
        越狱成功后自动生效，可随时关掉
      </p>
    </div>

    <!-- 列表项容器 (5项，行高 64dp 即 h-16，1px 分隔线) -->
    <div class="divide-y divide-[#F2E5E4] my-1">

      <!-- 1. SUSFS 隐藏 / 开 -->
      <div class="h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3.5 pr-2 overflow-hidden">
          <!-- 纯几何矢量图标容器: 隐藏/眼睛/盾牌防护隐蔽 -->
          <div class="w-9 h-9 rounded-xl bg-[#F8EBEA] flex items-center justify-center flex-shrink-0">
            <svg class="w-4.5 h-4.5 text-[#9B4A5A]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B4A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </div>
          <div class="flex flex-col truncate">
            <span class="text-[15px] font-semibold text-[#2D2326] leading-tight truncate">SUSFS 隐藏</span>
            <span class="text-[12px] text-[#70555B] leading-tight mt-1 truncate">隐藏 root 痕迹与挂载</span>
          </div>
        </div>
        <!-- 胶囊开关：开 (#9B4A5A) -->
        <div class="flex-shrink-0">
          <div class="w-12 h-7 bg-[#9B4A5A] rounded-full p-0.5 flex items-center justify-end cursor-pointer transition-colors shadow-inner">
            <div class="w-6 h-6 bg-[#FFF9F8] rounded-full shadow-sm transform transition-transform"></div>
          </div>
        </div>
      </div>

      <!-- 2. VFS 缓存 / 开 -->
      <div class="h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3.5 pr-2 overflow-hidden">
          <!-- 纯几何矢量图标: 存储/闪存缓存 -->
          <div class="w-9 h-9 rounded-xl bg-[#F8EBEA] flex items-center justify-center flex-shrink-0">
            <svg class="w-4.5 h-4.5 text-[#9B4A5A]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B4A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
          </div>
          <div class="flex flex-col truncate">
            <span class="text-[15px] font-semibold text-[#2D2326] leading-tight truncate">VFS 缓存</span>
            <span class="text-[12px] text-[#70555B] leading-tight mt-1 truncate">提升模块挂载兼容性</span>
          </div>
        </div>
        <!-- 胶囊开关：开 (#9B4A5A) -->
        <div class="flex-shrink-0">
          <div class="w-12 h-7 bg-[#9B4A5A] rounded-full p-0.5 flex items-center justify-end cursor-pointer transition-colors shadow-inner">
            <div class="w-6 h-6 bg-[#FFF9F8] rounded-full shadow-sm transform transition-transform"></div>
          </div>
        </div>
      </div>

      <!-- 3. 卸载保护 / 开 -->
      <div class="h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3.5 pr-2 overflow-hidden">
          <!-- 纯几何矢量图标: 保护盾牌 -->
          <div class="w-9 h-9 rounded-xl bg-[#F8EBEA] flex items-center justify-center flex-shrink-0">
            <svg class="w-4.5 h-4.5 text-[#9B4A5A]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B4A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </div>
          <div class="flex flex-col truncate">
            <span class="text-[15px] font-semibold text-[#2D2326] leading-tight truncate">卸载保护</span>
            <span class="text-[12px] text-[#70555B] leading-tight mt-1 truncate">阻止内核模块被卸载</span>
          </div>
        </div>
        <!-- 胶囊开关：开 (#9B4A5A) -->
        <div class="flex-shrink-0">
          <div class="w-12 h-7 bg-[#9B4A5A] rounded-full p-0.5 flex items-center justify-end cursor-pointer transition-colors shadow-inner">
            <div class="w-6 h-6 bg-[#FFF9F8] rounded-full shadow-sm transform transition-transform"></div>
          </div>
        </div>
      </div>

      <!-- 4. 反检测加固 / 关 -->
      <div class="h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3.5 pr-2 overflow-hidden">
          <!-- 纯几何矢量图标: 检测加固/锁头 -->
          <div class="w-9 h-9 rounded-xl bg-[#F5ECE9] flex items-center justify-center flex-shrink-0">
            <svg class="w-4.5 h-4.5 text-[#70555B]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#70555B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div class="flex flex-col truncate">
            <span class="text-[15px] font-semibold text-[#2D2326] leading-tight truncate">反检测加固</span>
            <span class="text-[12px] text-[#70555B] leading-tight mt-1 truncate">关闭系统 root 检测弹窗</span>
          </div>
        </div>
        <!-- 胶囊开关：关 (#DDCBC9) -->
        <div class="flex-shrink-0">
          <div class="w-12 h-7 bg-[#E2D2D0] rounded-full p-0.5 flex items-center justify-start cursor-pointer transition-colors">
            <div class="w-6 h-6 bg-[#FFF9F8] rounded-full shadow-sm transform transition-transform"></div>
          </div>
        </div>
      </div>

      <!-- 5. 软重启修复 / 关 -->
      <div class="h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3.5 pr-2 overflow-hidden">
          <!-- 纯几何矢量图标: 循环重启 -->
          <div class="w-9 h-9 rounded-xl bg-[#F5ECE9] flex items-center justify-center flex-shrink-0">
            <svg class="w-4.5 h-4.5 text-[#70555B]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#70555B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </div>
          <div class="flex flex-col truncate">
            <span class="text-[15px] font-semibold text-[#2D2326] leading-tight truncate">软重启修复</span>
            <span class="text-[12px] text-[#70555B] leading-tight mt-1 truncate">越狱后修复软重启</span>
          </div>
        </div>
        <!-- 胶囊开关：关 (#DDCBC9) -->
        <div class="flex-shrink-0">
          <div class="w-12 h-7 bg-[#E2D2D0] rounded-full p-0.5 flex items-center justify-start cursor-pointer transition-colors">
            <div class="w-6 h-6 bg-[#FFF9F8] rounded-full shadow-sm transform transition-transform"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部按钮栏：左侧文字按钮「全部关闭」，右侧主色实心按钮「完成」 -->
    <div class="mt-4 pt-2 flex items-center justify-between">
      <button class="px-3 py-2 text-[14px] font-medium text-[#70555B] hover:text-[#2D2326] active:scale-95 transition-all">
        全部关闭
      </button>
      <button class="px-6 py-2.5 bg-[#9B4A5A] text-[#FFF9F8] text-[14px] font-semibold rounded-full hover:bg-[#8B3F4E] active:scale-95 transition-all shadow-none">
        完成
      </button>
    </div>

  </div>

</body>
</html>
