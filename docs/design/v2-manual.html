<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户手册 - OneKey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#FBF4F2',
            appCard: '#F6EBE9',
            appPrimary: '#9B4A5A',
            appTextPrimary: '#2D2326',
            appTextSecondary: '#7F7275',
            appTextMuted: '#9E8E92',
            appTipBg: '#EFE0DF',
            appBorder: '#ECDCDA'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans SC"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FBF4F2;
      color: #2D2326;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-appBg min-h-screen flex flex-col font-sans antialiased text-appTextPrimary selection:bg-[#9B4A5A]/20">

  <!-- 顶部状态栏占位 (模拟原生 Android 沉浸式顶栏) -->
  <div class="w-full flex justify-between items-center px-6 pt-3 pb-1 text-xs font-semibold text-appTextSecondary">
    <span>09:41</span>
    <div class="flex items-center gap-1.5">
      <!-- 信号图标 -->
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.2"/>
        <path d="M2 17h3v4H2zm5-4h3v8H7zm5-4h3v12h-3zm5-5h3v17h-3z"/>
      </svg>
      <!-- WiFi 图标 -->
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.48 9.77 3.91L12 19.34 2.23 11.41C4.79 8.98 8.22 7.5 12 7.5z"/>
      </svg>
      <!-- 电池图标 -->
      <svg class="w-4 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M17 5v2h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1zm-2 1H9v1h6V6z"/>
      </svg>
    </div>
  </div>

  <!-- 顶栏导航: 左侧返回箭头与圆形头像，中间标题「用户手册」，右侧小字「v2.18.30 · 197」 -->
  <header class="w-full px-5 py-3 flex items-center justify-between border-b border-appBorder/50 sticky top-0 bg-appBg/95 backdrop-blur z-20">
    <div class="flex items-center gap-2.5">
      <!-- 返回箭头 -->
      <button class="w-8 h-8 rounded-full flex items-center justify-center text-appTextPrimary hover:bg-appCard active:scale-95 transition" aria-label="返回">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <!-- 圆形头像 -->
      <div class="w-8 h-8 rounded-full overflow-hidden border border-appPrimary/20 flex-shrink-0 bg-appCard">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrA7Wt3x5xKrY7-NkDQYx8ctfjjuaVtjTkCOCqKwzUKjOUlvUhtnqsscu8h0U3FWR58tmgwqrIOIo7cUiofZYKPbzt9rR7492ATzjxPG7Zg6QeTc_ojz0_ebqJ6Z6i18vxQ3U8AVItASPS5XNTQBIcVCZ2pE1R5M1kJ3zZRmjJxcqXHC5OfXTEhyUzs1q9zoGKts07YOrzh0gHaJwq-soyUTLiAbndf9CB7WwZO-sSU99dU-eZMW1YkISg" alt="用户头像" class="w-full h-full object-cover">
      </div>
    </div>

    <!-- 中间标题 -->
    <h1 class="text-base font-bold text-appTextPrimary tracking-tight">用户手册</h1>

    <!-- 右侧小字 -->
    <div class="text-xs text-appTextSecondary font-medium tracking-tight">
      v2.18.30 · 197
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="flex-1 px-5 pt-5 pb-8 overflow-y-auto">
    
    <!-- 导语部分：小标签「快速指引」 + 一行「从零开始，5 分钟完成越狱」 -->
    <div class="mb-5">
      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[#F4E1E3] text-appPrimary text-[12px] font-semibold mb-2 tracking-wide">
        <!-- 闪电闪标几何图 -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>快速指引</span>
      </div>
      <p class="text-[14px] text-appTextSecondary font-medium tracking-normal">
        从零开始，5 分钟完成越狱
      </p>
    </div>

    <!-- 步骤卡列表 -->
    <div class="flex flex-col gap-4">

      <!-- 步骤 1: 启动服务 -->
      <section class="bg-appCard rounded-[20px] p-5 border border-appBorder/60 shadow-none">
        <div class="flex items-start gap-3.5">
          <!-- 圆形序号 1 -->
          <div class="w-8 h-8 rounded-full border border-appPrimary/35 bg-appBg flex items-center justify-center text-appPrimary font-bold text-sm flex-shrink-0 shadow-none mt-0.5">
            1
          </div>
          <div class="flex-1">
            <h2 class="text-[15px] font-semibold text-appTextPrimary leading-snug">启动服务</h2>
            <p class="text-[13px] text-appTextSecondary mt-1.5 leading-relaxed">
              先打开 Stellar 并授予权限，状态卡显示服务在线即可。
            </p>
          </div>
        </div>
      </section>

      <!-- 步骤 2: 开始越狱 -->
      <section class="bg-appCard rounded-[20px] p-5 border border-appBorder/60 shadow-none">
        <div class="flex items-start gap-3.5">
          <!-- 圆形序号 2 -->
          <div class="w-8 h-8 rounded-full border border-appPrimary/35 bg-appBg flex items-center justify-center text-appPrimary font-bold text-sm flex-shrink-0 shadow-none mt-0.5">
            2
          </div>
          <div class="flex-1">
            <h2 class="text-[15px] font-semibold text-appTextPrimary leading-snug">开始越狱</h2>
            <p class="text-[13px] text-appTextSecondary mt-1.5 leading-relaxed">
              点击首页主按钮，等待 5–30 秒；成功后状态卡显示 SU 就绪。
            </p>
          </div>
        </div>
      </section>

      <!-- 步骤 3: 启用热切换（进阶） -->
      <section class="bg-appCard rounded-[20px] p-5 border border-appBorder/60 shadow-none">
        <div class="flex items-start gap-3.5">
          <!-- 圆形序号 3 -->
          <div class="w-8 h-8 rounded-full border border-appPrimary/35 bg-appBg flex items-center justify-center text-appPrimary font-bold text-sm flex-shrink-0 shadow-none mt-0.5">
            3
          </div>
          <div class="flex-1">
            <h2 class="text-[15px] font-semibold text-appTextPrimary leading-snug">启用热切换（进阶）</h2>
            <p class="text-[13px] text-appTextSecondary mt-1.5 leading-relaxed">
              安装通用加载器 → 重启手机 → 再运行一次越狱，之后即可在五家管理器之间直接切换。
            </p>

            <!-- 内嵌提示块：浅主色底、圆角 12dp、左侧竖条 -->
            <div class="mt-3.5 bg-appTipBg rounded-[12px] p-3 pl-3.5 border-l-4 border-appPrimary flex items-start gap-2.5">
              <!-- 提示圆形信息几何矢量图标 -->
              <svg class="w-4 h-4 text-appPrimary flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <p class="text-[12.5px] text-appTextPrimary font-normal leading-normal">
                管理器升级后加载器会被还原，App 会自动补装。
              </p>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- 底部：主色文字按钮「查看常见问题」 -->
    <div class="mt-8 flex justify-center">
      <button class="inline-flex items-center gap-1.5 text-appPrimary font-semibold text-[14px] hover:opacity-80 active:scale-98 transition py-2 px-3 rounded-lg">
        <!-- 帮助问号/常见问题几何矢量图标 -->
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>查看常见问题</span>
        <!-- 箭头指示 -->
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

  </main>

  <!-- 底部导航：保持现有样式——与页面同宽的浅色底栏，四项等分（首页 / 日志 / 历史 / 关于），图标 + 11sp 文字，选中项为主色，其余次级灰。不要悬浮胶囊。 -->
  <nav class="w-full bg-appBg border-t border-appBorder/80 px-2 pt-2.5 pb-safe z-30">
    <div class="grid grid-cols-4 items-center">
      
      <!-- 1. 首页 (次级灰) -->
      <button class="flex flex-col items-center justify-center py-1 group">
        <svg class="w-5 h-5 text-appTextSecondary group-hover:text-appPrimary transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="text-[11px] text-appTextSecondary mt-1 group-hover:text-appPrimary transition font-medium">首页</span>
      </button>

      <!-- 2. 日志 (次级灰) -->
      <button class="flex flex-col items-center justify-center py-1 group">
        <svg class="w-5 h-5 text-appTextSecondary group-hover:text-appPrimary transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span class="text-[11px] text-appTextSecondary mt-1 group-hover:text-appPrimary transition font-medium">日志</span>
      </button>

      <!-- 3. 历史 (次级灰) -->
      <button class="flex flex-col items-center justify-center py-1 group">
        <svg class="w-5 h-5 text-appTextSecondary group-hover:text-appPrimary transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="text-[11px] text-appTextSecondary mt-1 group-hover:text-appPrimary transition font-medium">历史</span>
      </button>

      <!-- 4. 关于 (用户手册归属关于模块，选中项为主色 #9B4A5A) -->
      <button class="flex flex-col items-center justify-center py-1">
        <svg class="w-5 h-5 text-appPrimary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span class="text-[11px] text-appPrimary mt-1 font-semibold">关于</span>
      </button>

    </div>
  </nav>

</body>
</html>
